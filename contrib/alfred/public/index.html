<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alfred</title>
    <style>
      :root {
        --bg: #f6f4ef;
        --panel: #ffffff;
        --text: #1d1b16;
        --muted: #6b665c;
        --accent: #7a5c1e;
        --user: #e9e2d0;
        --border: #ddd6c6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15140f;
          --panel: #1f1d17;
          --text: #ece6d8;
          --muted: #a29b8b;
          --accent: #d9b56a;
          --user: #2e2a20;
          --border: #37332a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }
      header h1 {
        font-size: 1.15rem;
        margin: 0;
        flex: 1;
      }
      header small {
        color: var(--muted);
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 760px;
        width: 100%;
        margin: 0 auto;
      }
      .msg {
        padding: 10px 14px;
        border-radius: 14px;
        max-width: 85%;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .user {
        background: var(--user);
        align-self: flex-end;
      }
      .assistant {
        background: var(--panel);
        border: 1px solid var(--border);
        align-self: flex-start;
      }
      .error {
        color: #b3261e;
        align-self: center;
        font-size: 0.9rem;
      }
      #status {
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
        min-height: 1.4em;
        padding: 0 16px;
      }
      form {
        display: flex;
        gap: 8px;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        max-width: 760px;
        width: 100%;
        margin: 0 auto;
      }
      input[type="text"] {
        flex: 1;
        min-width: 0;
        padding: 12px 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font-size: 1rem;
      }
      button {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        border-radius: 999px;
        padding: 0 14px;
        min-height: 44px;
        font-size: 1rem;
        cursor: pointer;
      }
      #mic {
        width: 56px;
        font-size: 1.4rem;
        background: var(--accent);
        color: var(--bg);
        border: none;
      }
      #mic.listening {
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.55;
        }
      }
      label.toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🎩 Alfred <small id="model"></small></h1>
      <label class="toggle" title="Fica ouvindo e responde quando você diz 'Alfred'">
        <input type="checkbox" id="wake" /> Modo “Alfred…”
      </label>
      <label class="toggle"><input type="checkbox" id="speak" checked /> Voz</label>
      <button id="reset" type="button" title="Nova conversa">↺</button>
    </header>

    <main id="log" aria-live="polite"></main>
    <div id="status"></div>

    <form id="form">
      <button id="mic" type="button" title="Falar (ou segure Espaço)">🎙️</button>
      <input id="text" type="text" placeholder="Fale ou digite…" autocomplete="off" />
      <button type="submit">Enviar</button>
    </form>

    <script>
      const $ = (id) => document.getElementById(id);
      const log = $("log");
      const statusEl = $("status");
      const store = {
        get(key, fallback) {
          try {
            const v = localStorage.getItem("alfred:" + key);
            return v === null ? fallback : JSON.parse(v);
          } catch {
            return fallback;
          }
        },
        set(key, value) {
          try {
            localStorage.setItem("alfred:" + key, JSON.stringify(value));
          } catch {}
        },
      };

      let history = store.get("history", []);
      let busy = false;
      let token = store.get("token", "");

      function setStatus(text) {
        statusEl.textContent = text || "";
      }

      function addBubble(role, text) {
        const div = document.createElement("div");
        div.className = "msg " + role;
        div.textContent = text;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
        return div;
      }

      function render() {
        log.innerHTML = "";
        if (history.length === 0) addBubble("assistant", "Boa noite. Em que posso ser útil?");
        for (const m of history) addBubble(m.role, m.content);
      }

      // ---------- Voz (fala) ----------
      const synth = window.speechSynthesis;
      let voice = null;
      function pickVoice() {
        const voices = synth ? synth.getVoices() : [];
        voice =
          voices.find((v) => v.lang === "pt-BR" && /google|natural|online/i.test(v.name)) ||
          voices.find((v) => v.lang === "pt-BR") ||
          voices.find((v) => v.lang.startsWith("pt")) ||
          null;
      }
      if (synth) {
        pickVoice();
        synth.onvoiceschanged = pickVoice;
      }
      function speak(text) {
        if (!synth || !$("speak").checked || !text.trim()) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "pt-BR";
        if (voice) u.voice = voice;
        u.rate = 1.05;
        u.onend = () => {
          if (!synth.speaking) resumeWakeListening();
        };
        synth.speak(u);
      }
      function stopSpeaking() {
        if (synth) synth.cancel();
      }

      // ---------- Conversa ----------
      async function ask(text) {
        text = text.trim();
        if (!text || busy) return;
        busy = true;
        stopSpeaking();
        history.push({ role: "user", content: text });
        addBubble("user", text);
        const bubble = addBubble("assistant", "…");
        setStatus("Alfred está pensando…");

        let full = "";
        let pending = ""; // texto ainda não falado (fala frase a frase)
        try {
          const res = await fetch("api/chat", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              ...(token ? { authorization: "Bearer " + token } : {}),
            },
            body: JSON.stringify({ messages: history }),
          });
          if (res.status === 401) {
            token = prompt("Token de acesso do Alfred:") || "";
            store.set("token", token);
            throw new Error("Token inválido. Tente de novo.");
          }
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error || "Erro " + res.status);
          }
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buf = "";
          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const events = buf.split("\n\n");
            buf = events.pop();
            for (const ev of events) {
              const data = ev.replace(/^data:\s*/, "");
              if (data === "[DONE]") continue;
              const msg = JSON.parse(data);
              if (msg.error) throw new Error(msg.error);
              full += msg.text;
              pending += msg.text;
              bubble.textContent = full;
              log.scrollTop = log.scrollHeight;
              // Fala cada frase completa assim que chega, para responder mais rápido.
              const m = pending.match(/^[\s\S]*?[.!?…](\s|$)/);
              if (m) {
                speak(m[0]);
                pending = pending.slice(m[0].length);
              }
            }
          }
          speak(pending);
          history.push({ role: "assistant", content: full || "(sem resposta)" });
          store.set("history", history.slice(-40));
          setStatus("");
        } catch (err) {
          history.pop();
          bubble.remove();
          addBubble("error", err.message);
          setStatus("");
        } finally {
          busy = false;
          if (!synth || !synth.speaking) resumeWakeListening();
        }
      }

      // ---------- Reconhecimento de voz ----------
      const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      let rec = null;
      let listening = false;
      let mode = "push"; // "push" = clique no microfone; "wake" = espera a palavra "Alfred"
      let followUp = false;

      function startListening(newMode) {
        if (!Recognition) {
          setStatus("Este navegador não reconhece voz — use Chrome/Edge, ou digite.");
          return;
        }
        if (listening) return;
        mode = newMode;
        stopSpeaking();
        rec = new Recognition();
        rec.lang = "pt-BR";
        rec.interimResults = true;
        rec.continuous = mode === "wake";
        let finalText = "";
        rec.onresult = (e) => {
          let interim = "";
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const r = e.results[i];
            if (r.isFinal) finalText += r[0].transcript;
            else interim += r[0].transcript;
          }
          if (mode === "push") {
            $("text").value = finalText + interim;
            return;
          }
          // Modo palavra-chave: só reage se a frase contém "Alfred".
          const said = finalText.trim();
          const hit = said.match(/\balfred\b[,!.]?\s*(.*)$/i);
          if (hit) {
            rec.stop();
            if (hit[1].trim()) ask(hit[1]);
            else {
              // Só disse "Alfred": responde e escuta a próxima frase como pergunta.
              followUp = true;
              speak("Pois não?");
            }
          }
          finalText = "";
        };
        rec.onerror = (e) => {
          if (e.error === "not-allowed") {
            setStatus("Permita o uso do microfone (a página precisa estar em localhost ou https).");
            $("wake").checked = false;
          }
        };
        rec.onend = () => {
          listening = false;
          $("mic").classList.remove("listening");
          if (mode === "push") {
            setStatus("");
            const text = $("text").value;
            $("text").value = "";
            if (text.trim()) ask(text);
            else resumeWakeListening();
          } else {
            resumeWakeListening();
          }
        };
        rec.start();
        listening = true;
        $("mic").classList.add("listening");
        setStatus(mode === "wake" ? "Diga “Alfred, …”" : "Ouvindo…");
      }

      function resumeWakeListening() {
        if ($("wake").checked && !busy && !listening && !(synth && synth.speaking)) {
          const next = followUp ? "push" : "wake";
          followUp = false;
          setTimeout(() => startListening(next), 300);
        }
      }

      $("mic").addEventListener("click", () => {
        if (listening) rec.stop();
        else startListening("push");
      });
      $("wake").addEventListener("change", (e) => {
        if (e.target.checked) startListening("wake");
        else if (listening) {
          mode = "push-off";
          rec.stop();
          setStatus("");
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.code === "Space" && document.activeElement !== $("text") && !e.repeat) {
          e.preventDefault();
          if (!listening) startListening("push");
        }
      });
      document.addEventListener("keyup", (e) => {
        if (e.code === "Space" && listening && mode === "push") rec.stop();
      });

      $("form").addEventListener("submit", (e) => {
        e.preventDefault();
        const text = $("text").value;
        $("text").value = "";
        ask(text);
      });
      $("reset").addEventListener("click", () => {
        stopSpeaking();
        history = [];
        store.set("history", history);
        render();
      });

      fetch("api/health")
        .then((r) => r.json())
        .then((h) => ($("model").textContent = "· " + h.model))
        .catch(() => setStatus("Servidor do Alfred offline."));
      render();
    </script>
  </body>
</html>
