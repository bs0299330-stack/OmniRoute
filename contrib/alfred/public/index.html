<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Alfred</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&family=Oxanium:wght@400;500;600&family=Share+Tech+Mono&display=swap"
    />
    <link rel="stylesheet" href="hud.css" />
  </head>
  <body>
    <div class="hud">
      <header class="hud-top">
        <div class="brand">
          <h1>ALFRED</h1>
          <span class="tagline">Sistema pessoal · <b id="online">online</b></span>
        </div>
        <div class="readouts">
          <div class="date">DATA<strong id="date">—</strong></div>
          <div>HORA<strong id="clock">--:--:--</strong></div>
        </div>
      </header>

      <main class="hud-main">
        <section class="stage" aria-label="Alfred">
          <canvas id="orb" aria-hidden="true"></canvas>
          <div class="state" id="state" data-state="idle">Em espera</div>
          <p class="caption" id="caption" aria-live="polite">Boa noite. Em que posso ser útil?</p>
          <div class="chips">
            <span class="chip">Cérebro <b id="chipBrain">—</b></span>
            <span class="chip">Voz <b id="chipVoice">—</b></span>
          </div>
          <div class="chips">
            <label class="chip" for="wake" title="Fica ouvindo e responde quando você diz “Alfred”">
              <input type="checkbox" id="wake" /> Sempre ouvindo
            </label>
            <label class="chip" for="followup" title="Depois de responder, já escuta a sua próxima frase">
              <input type="checkbox" id="followup" checked /> Modo conversa
            </label>
            <label class="chip" for="speak"><input type="checkbox" id="speak" checked /> Voz</label>
          </div>
        </section>

        <aside class="panel">
          <details class="voice" id="voicePanel">
            <summary>AJUSTAR VOZ</summary>
            <div class="voice-grid">
              <label class="field" for="engine" id="engineField" hidden>
                Motor
                <select id="engine">
                  <option value="neural">Voz de IA</option>
                  <option value="browser">Voz do navegador</option>
                </select>
              </label>
              <label class="field" for="aiVoice" id="aiVoiceField" hidden>
                Voz de IA
                <select id="aiVoice"></select>
              </label>
              <label class="field" for="voice" id="voiceField">
                Voz
                <select id="voice"></select>
              </label>
              <label class="field" for="rate" id="rateField">
                <span>Velocidade <output id="rateOut"></output></span>
                <input type="range" id="rate" min="0.7" max="1.4" step="0.05" />
              </label>
              <label class="field" for="pitch" id="pitchField">
                <span>Tom <output id="pitchOut"></output></span>
                <input type="range" id="pitch" min="0.5" max="1.3" step="0.05" />
              </label>
              <div class="field">
                <span>&nbsp;</span>
                <div class="row">
                  <button class="ghost" id="testVoice" type="button">Testar</button>
                  <button class="ghost" id="resetVoice" type="button">Padrão</button>
                </div>
              </div>
            </div>
          </details>
          <h2>REGISTRO <button class="ghost" id="reset" type="button">Nova conversa</button></h2>
          <div id="log" aria-live="polite"></div>
        </aside>
      </main>

      <footer class="hud-bar">
        <form id="form">
          <button id="mic" type="button" title="Falar (ou segure Espaço)" aria-label="Falar">🎙</button>
          <input id="text" type="text" placeholder="Fale ou digite um comando…" autocomplete="off" />
          <button id="send" type="submit">Enviar</button>
        </form>
        <div class="hud-status">
          <span id="status" role="status"></span>
          <span>ESPAÇO falar · ESC interromper · “ALFRED, …” com Sempre ouvindo</span>
        </div>
      </footer>
    </div>

    <script type="module">
      import {
        VOICE_DEFAULTS,
        VOICE_TEST_LINE,
        createEarcons,
        createSpeaker,
        matchWakeWord,
      } from "./voice.mjs";
      import { STATE_LABELS, createOrb, startClock } from "./hud.mjs";

      const $ = (id) => document.getElementById(id);
      const log = $("log");
      const store = {
        get(key, fallback) {
          try {
            const v = localStorage.getItem("alfred:" + key);
            return v === null ? fallback : JSON.parse(v);
          } catch {
            return fallback;
          }
        },
        set(key, value) {
          try {
            localStorage.setItem("alfred:" + key, JSON.stringify(value));
          } catch {}
        },
      };

      let history = store.get("history", []);
      let token = store.get("token", "");
      // "voice:v2": the first version stored a lowered pitch that made voices sound robotic.
      let voiceSettings = { ...VOICE_DEFAULTS, ...store.get("voice:v2", {}) };
      let busy = false;
      let ttsAvailable = false;
      let tts = null; // { provider, voice, voices } from /api/health
      let lastViaVoice = false;
      for (const id of ["wake", "followup", "speak"]) {
        $(id).checked = store.get("toggle:" + id, $(id).checked);
      }

      // ---------- HUD ----------
      const orb = createOrb($("orb"));
      startClock($("clock"), $("date"));
      function setPhase(phase, label) {
        orb.setState(phase);
        $("state").dataset.state = phase;
        $("state").textContent = label || STATE_LABELS[phase];
      }
      function settle() {
        if (busy) return setPhase("thinking");
        if (speaker.speaking) return setPhase("speaking");
        if (listening === "command") return setPhase("listening");
        if (listening === "wake") return setPhase("idle", "Aguardando “Alfred”");
        setPhase("idle");
      }

      let audioCtx = null;
      function analyse(audio) {
        // Only route through Web Audio when it is running; a suspended context would mute playback.
        try {
          audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state !== "running") return;
          const source = audioCtx.createMediaElementSource(audio);
          const analyser = audioCtx.createAnalyser();
          analyser.fftSize = 512;
          source.connect(analyser);
          analyser.connect(audioCtx.destination);
          orb.attachAnalyser(analyser);
        } catch {}
      }

      const authHeaders = () => (token ? { authorization: "Bearer " + token } : {});
      const earcons = createEarcons();
      const speaker = createSpeaker({
        getSettings: () => voiceSettings,
        fetchNeural: async (text) => {
          const res = await fetch("api/tts", {
            method: "POST",
            headers: { "content-type": "application/json", ...authHeaders() },
            body: JSON.stringify({ text, voice: voiceSettings.aiVoice || tts?.voice }),
          });
          if (!res.ok) throw new Error("tts " + res.status);
          return res.blob();
        },
        onError: () => setStatus("A voz de IA falhou nesta frase; usei a voz do navegador.", true),
        onWord: () => orb.pulse(),
        onAudio: analyse,
      });
      function unlockAudio() {
        speaker.unlock();
        try {
          audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
        } catch {}
      }

      // ---------- Interface ----------
      function setStatus(text, warn = false) {
        $("status").textContent = text || "";
        $("status").classList.toggle("warn", !!warn);
      }

      function addEntry(kind, text) {
        const entry = document.createElement("div");
        entry.className = "entry " + kind;
        const who = document.createElement("span");
        who.className = "who";
        const time = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
        who.textContent = (kind === "user" ? "VOCÊ" : kind === "alfred" ? "ALFRED" : "SISTEMA") + " · " + time;
        const what = document.createElement("div");
        what.className = "what";
        what.textContent = text;
        entry.append(who, what);
        log.appendChild(entry);
        log.scrollTop = log.scrollHeight;
        return what;
      }

      function render() {
        log.innerHTML = "";
        if (history.length === 0) addEntry("alfred", "Boa noite. Em que posso ser útil?");
        for (const m of history) addEntry(m.role === "user" ? "user" : "alfred", m.content);
      }

      function voiceLabel() {
        if (voiceSettings.engine === "neural" && ttsAvailable) {
          return "IA · " + (voiceSettings.aiVoice || tts?.voice || "");
        }
        return "Navegador";
      }

      // ---------- Painel de voz ----------
      function syncVoiceUi() {
        $("engine").value = voiceSettings.engine;
        $("rate").value = voiceSettings.rate;
        $("pitch").value = voiceSettings.pitch;
        $("rateOut").textContent = Number(voiceSettings.rate).toFixed(2) + "×";
        $("pitchOut").textContent = Number(voiceSettings.pitch).toFixed(2);
        const neural = voiceSettings.engine === "neural" && ttsAvailable;
        $("voiceField").hidden = neural;
        $("pitchField").hidden = neural;
        $("rateField").hidden = neural;
        $("aiVoiceField").hidden = !neural || !(tts?.voices?.length > 0);
        $("voice").value = voiceSettings.voiceURI;
        $("aiVoice").value = voiceSettings.aiVoice || tts?.voice || "";
        $("chipVoice").textContent = voiceLabel();
      }
      function saveVoice(patch) {
        voiceSettings = { ...voiceSettings, ...patch };
        store.set("voice:v2", voiceSettings);
        syncVoiceUi();
      }
      speaker.onVoices((voices) => {
        const select = $("voice");
        select.innerHTML = "";
        select.add(new Option("Automática (melhor disponível)", ""));
        for (const v of voices) select.add(new Option(`${v.name} (${v.lang})`, v.voiceURI));
        if (voices.length === 0) select.add(new Option("Nenhuma voz em português neste navegador", ""));
        syncVoiceUi();
      });
      $("engine").addEventListener("change", (e) => saveVoice({ engine: e.target.value }));
      $("voice").addEventListener("change", (e) => saveVoice({ voiceURI: e.target.value }));
      $("aiVoice").addEventListener("change", (e) => saveVoice({ aiVoice: e.target.value }));
      $("rate").addEventListener("input", (e) => saveVoice({ rate: Number(e.target.value) }));
      $("pitch").addEventListener("input", (e) => saveVoice({ pitch: Number(e.target.value) }));
      $("testVoice").addEventListener("click", () => {
        unlockAudio();
        speaker.cancel();
        $("caption").textContent = VOICE_TEST_LINE;
        speaker.sayAll(VOICE_TEST_LINE);
      });
      $("resetVoice").addEventListener("click", () => {
        unlockAudio();
        saveVoice({ ...VOICE_DEFAULTS, engine: ttsAvailable ? "neural" : "browser" });
        speaker.cancel();
        speaker.sayAll(VOICE_TEST_LINE);
      });

      speaker.onChange((speaking) => {
        if (speaking) stopListening(); // não ouvir a própria voz
        else scheduleListening();
        settle();
      });

      // ---------- Conversa ----------
      async function ask(text, { viaVoice = false } = {}) {
        text = text.trim();
        if (!text || busy) return;
        busy = true;
        lastViaVoice = viaVoice;
        stopListening();
        speaker.cancel();
        setStatus("");
        settle();
        const chunker = speaker.chunker();
        const say = (pieces) => {
          if ($("speak").checked) for (const p of pieces) speaker.say(p);
        };

        history.push({ role: "user", content: text });
        addEntry("user", text);
        const entry = addEntry("alfred", "…");
        $("caption").textContent = "…";

        let full = "";
        try {
          const res = await fetch("api/chat", {
            method: "POST",
            headers: { "content-type": "application/json", ...authHeaders() },
            body: JSON.stringify({ messages: history }),
          });
          if (res.status === 401) {
            token = window.prompt("Token de acesso do Alfred:") || "";
            store.set("token", token);
            throw new Error("Token inválido. Tente de novo.");
          }
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error || "Erro " + res.status);
          }
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buf = "";
          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const events = buf.split("\n\n");
            buf = events.pop();
            for (const ev of events) {
              const data = ev.replace(/^data:\s*/, "");
              if (!data || data === "[DONE]") continue;
              const msg = JSON.parse(data);
              if (msg.error) throw new Error(msg.error);
              full += msg.text;
              entry.textContent = full;
              $("caption").textContent = full;
              log.scrollTop = log.scrollHeight;
              say(chunker.push(msg.text));
            }
          }
          say(chunker.flush());
          history.push({ role: "assistant", content: full || "(sem resposta)" });
          store.set("history", history.slice(-40));
        } catch (err) {
          history.pop();
          entry.closest(".entry").remove();
          addEntry("note", err.message);
          $("caption").textContent = err.message;
          lastViaVoice = false;
        } finally {
          busy = false;
          settle();
          scheduleListening();
        }
      }

      // ---------- Microfone ----------
      // Estados: parado → "command" (uma frase) ou "wake" (espera “Alfred”).
      // Enquanto Alfred fala, o microfone fica fechado para ele não ouvir a própria voz.
      const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      let rec = null;
      let listening = null; // "command" | "wake" | null
      let scheduled = null;
      let quickEnds = 0;

      if (!Recognition) {
        $("mic").disabled = true;
        $("mic").title = "Este navegador não reconhece voz — use Chrome ou Edge";
        $("wake").disabled = true;
      }

      function stopListening() {
        clearTimeout(scheduled);
        scheduled = null;
        if (!rec) return;
        const r = rec;
        rec = null;
        listening = null;
        r.onend = null;
        r.onresult = null;
        r.onerror = null;
        try {
          r.abort();
        } catch {}
        $("mic").classList.remove("listening");
        settle();
      }

      function listen(mode) {
        if (!Recognition) return;
        stopListening();
        const r = new Recognition();
        r.lang = "pt-BR";
        r.interimResults = true;
        r.continuous = mode === "wake";
        r.maxAlternatives = 1;
        const startedAt = Date.now();
        let finalText = "";
        let fired = false;

        r.onresult = (e) => {
          let interim = "";
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const res = e.results[i];
            if (res.isFinal) finalText += res[0].transcript + " ";
            else interim += res[0].transcript;
          }
          if (mode === "command") {
            const heardSoFar = (finalText + interim).trim();
            $("text").value = heardSoFar;
            $("caption").textContent = heardSoFar || "…";
            return;
          }
          // wake: só reage a frases finais que contêm “Alfred”; o resto é descartado.
          if (fired) return;
          const heard = matchWakeWord(finalText);
          if (!heard) {
            finalText = "";
            return;
          }
          fired = true;
          stopListening();
          if (heard.command) {
            ask(heard.command, { viaVoice: true });
          } else {
            earcons.listen();
            listen("command");
          }
        };
        r.onerror = (e) => {
          if (e.error === "not-allowed" || e.error === "service-not-allowed") {
            $("wake").checked = false;
            store.set("toggle:wake", false);
            setStatus("Permita o microfone (cadeado na barra de endereço). A página precisa estar em localhost ou https.", true);
          } else if (e.error === "audio-capture") {
            setStatus("Nenhum microfone encontrado.", true);
          }
        };
        r.onend = () => {
          if (rec !== r) return;
          rec = null;
          listening = null;
          $("mic").classList.remove("listening");
          settle();
          if (mode === "command") {
            const text = $("text").value.trim();
            $("text").value = "";
            if (text) {
              earcons.done();
              ask(text, { viaVoice: true });
              return;
            }
          }
          // Evita loop quente se o reconhecimento cair logo ao abrir (sem rede, sem permissão).
          quickEnds = Date.now() - startedAt < 1500 ? quickEnds + 1 : 0;
          if (quickEnds >= 3) {
            quickEnds = 0;
            $("wake").checked = false;
            setStatus("O reconhecimento de voz parou. Toque no microfone para tentar de novo.", true);
            return;
          }
          scheduleListening();
        };

        try {
          r.start();
        } catch {
          return;
        }
        rec = r;
        listening = mode;
        if (mode === "command") $("mic").classList.add("listening");
        settle();
      }

      // Decide o que o microfone faz quando Alfred termina de falar.
      function scheduleListening() {
        clearTimeout(scheduled);
        scheduled = setTimeout(() => {
          scheduled = null;
          if (busy || speaker.speaking || rec) return;
          if (lastViaVoice && $("followup").checked) {
            lastViaVoice = false;
            earcons.listen();
            return listen("command");
          }
          lastViaVoice = false;
          if ($("wake").checked) listen("wake");
        }, 200);
      }

      function interrupt() {
        speaker.cancel();
        lastViaVoice = false;
        settle();
      }

      $("mic").addEventListener("click", () => {
        unlockAudio();
        if (listening === "command") {
          rec.stop(); // envia o que já ouviu
          return;
        }
        speaker.cancel();
        earcons.listen();
        listen("command");
      });
      $("wake").addEventListener("change", (e) => {
        store.set("toggle:wake", e.target.checked);
        if (e.target.checked) scheduleListening();
        else if (listening === "wake") stopListening();
      });
      for (const id of ["followup", "speak"]) {
        $(id).addEventListener("change", (e) => {
          store.set("toggle:" + id, e.target.checked);
          if (id === "speak" && !e.target.checked) speaker.cancel();
        });
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") interrupt();
        if (e.code === "Space" && document.activeElement === document.body && !e.repeat) {
          e.preventDefault();
          unlockAudio();
          speaker.cancel();
          if (listening !== "command") {
            earcons.listen();
            listen("command");
          }
        }
      });
      document.addEventListener("keyup", (e) => {
        if (e.code === "Space" && listening === "command" && document.activeElement === document.body) {
          rec.stop();
        }
      });
      document.addEventListener("pointerdown", unlockAudio, { once: true });

      $("form").addEventListener("submit", (e) => {
        e.preventDefault();
        unlockAudio();
        const text = $("text").value;
        $("text").value = "";
        ask(text);
      });
      $("reset").addEventListener("click", () => {
        interrupt();
        history = [];
        store.set("history", history);
        $("caption").textContent = "Boa noite. Em que posso ser útil?";
        render();
      });

      fetch("api/health")
        .then((r) => r.json())
        .then((h) => {
          $("chipBrain").textContent = h.brain || "—";
          tts = h.tts || null;
          ttsAvailable = !!tts;
          $("engineField").hidden = !ttsAvailable;
          const aiSelect = $("aiVoice");
          aiSelect.innerHTML = "";
          for (const v of tts?.voices ?? []) aiSelect.add(new Option(v === tts.voice ? v + " (padrão)" : v, v));
          if (ttsAvailable && !store.get("voice:v2", null)) saveVoice({ engine: "neural" });
          if (!ttsAvailable && voiceSettings.engine === "neural") saveVoice({ engine: "browser" });
          syncVoiceUi();
        })
        .catch(() => {
          $("online").textContent = "offline";
          setStatus("Servidor do Alfred offline.", true);
        });

      syncVoiceUi();
      render();
      settle();
      if ($("wake").checked) scheduleListening();
    </script>
  </body>
</html>
