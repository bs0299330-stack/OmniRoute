<title>Alfred</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&family=Saira+Condensed:wght@500;600;700&family=Share+Tech+Mono&display=swap"
/>
<!-- Source of the Claude artifact. `node contrib/alfred/claude/build.mjs` inlines hud.css,
     voice.mjs and hud.mjs from ../public into one self-contained page before publishing. -->
<link rel="stylesheet" href="hud.css" />

<div class="hud">
  <header class="hud-top">
    <div class="brand">
      <h1>ALFRED</h1>
      <span class="tagline">Sistema pessoal · <b id="online">conectando</b></span>
    </div>
    <div class="readouts">
      <div class="date">DATA<strong id="date">—</strong></div>
      <div>HORA<strong id="clock">--:--:--</strong></div>
    </div>
  </header>

  <main class="hud-main">
    <section class="stage" aria-label="Alfred">
      <canvas id="orb" aria-hidden="true"></canvas>
      <div class="state" id="state" data-state="idle">Em espera</div>
      <p class="caption" id="caption" aria-live="polite">Boa noite. Em que posso ser útil?</p>
      <div class="suggestions" id="suggestions"></div>
      <div class="chips">
        <span class="chip">Cérebro <b>Claude</b></span>
        <span class="chip">Voz <b id="chipVoice">Navegador</b></span>
        <label class="chip" for="speak"><input type="checkbox" id="speak" checked /> Falar respostas</label>
        <label class="chip" for="autosend" title="Para o ditado do teclado: envia quando você para de falar">
          <input type="checkbox" id="autosend" /> Modo ditado
        </label>
      </div>
    </section>

    <aside class="panel">
      <details class="voice" id="voicePanel">
        <summary>AJUSTAR VOZ</summary>
        <div class="voice-grid">
          <label class="field" for="voice">
            Voz
            <select id="voice"></select>
          </label>
          <label class="field" for="rate">
            <span>Velocidade <output id="rateOut"></output></span>
            <input type="range" id="rate" min="0.7" max="1.4" step="0.05" />
          </label>
          <label class="field" for="pitch">
            <span>Tom <output id="pitchOut"></output></span>
            <input type="range" id="pitch" min="0.5" max="1.3" step="0.05" />
          </label>
          <div class="field">
            <span>&nbsp;</span>
            <div class="row">
              <button class="ghost" id="testVoice" type="button">Testar</button>
              <button class="ghost" id="resetVoice" type="button">Padrão</button>
            </div>
          </div>
        </div>
      </details>
      <h2>REGISTRO <button class="ghost" id="reset" type="button">Nova conversa</button></h2>
      <div id="log" aria-live="polite"></div>
    </aside>
  </main>

  <footer class="hud-bar">
    <form id="form">
      <button id="mic" type="button" title="Falar" aria-label="Falar" hidden>🎙</button>
      <input id="text" type="text" placeholder="Escreva ou dite…" autocomplete="off" />
      <button id="send" type="submit">Enviar</button>
      <button class="ghost" id="stop" type="button" hidden>Parar</button>
    </form>
    <div class="hud-status">
      <span id="status" role="status"></span>
      <span>Modo ditado: toque no campo, use o 🎤 do teclado e fale — ele envia quando você para</span>
    </div>
  </footer>
</div>

<script type="module">
  import { VOICE_DEFAULTS, VOICE_TEST_LINE, createEarcons, createSpeaker } from "./voice.mjs";
  import { STATE_LABELS, createOrb, startClock } from "./hud.mjs";

  const $ = (id) => document.getElementById(id);
  const log = $("log");
  const MAX_TURNS = 30;
  const GREETING = "Boa noite. Em que posso ser útil?";
  const SUGGESTIONS = [
    "Que dia é hoje?",
    "Organize o meu dia",
    "Uma curiosidade rápida",
    "Sugira um jantar fácil",
  ];

  const store = {
    get(key, fallback) {
      try {
        const raw = localStorage.getItem("alfred:" + key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch {
        return fallback;
      }
    },
    set(key, value) {
      try {
        localStorage.setItem("alfred:" + key, JSON.stringify(value));
      } catch {}
    },
  };

  let turns = store.get("turns", []);
  // "voice:v2": the first version stored a lowered pitch that made voices sound robotic.
  let voiceSettings = { ...VOICE_DEFAULTS, ...store.get("voice:v2", {}), engine: "browser" };
  let sample = null;
  let ctl = null;
  let busy = false;
  let unavailable = false;
  $("speak").checked = store.get("speak", true);

  const orb = createOrb($("orb"));
  startClock($("clock"), $("date"));
  const speaker = createSpeaker({ getSettings: () => voiceSettings, onWord: () => orb.pulse() });
  const earcons = createEarcons();
  let micOn = false;

  function settle() {
    const phase = busy ? "thinking" : speaker.speaking ? "speaking" : micOn ? "listening" : "idle";
    orb.setState(phase);
    $("state").dataset.state = phase;
    $("state").textContent = STATE_LABELS[phase];
    $("stop").hidden = !(busy || speaker.speaking);
  }
  speaker.onChange(settle);

  function setStatus(text, warn = false) {
    $("status").textContent = text || "";
    $("status").classList.toggle("warn", !!warn);
  }

  function rules() {
    const now = new Date().toLocaleString("pt-BR", { dateStyle: "full", timeStyle: "short" });
    return [
      "Você é Alfred, mordomo e assistente pessoal: educado, prestativo, discreto e com um leve",
      "humor britânico. Responda em português do Brasil, a menos que eu fale outro idioma.",
      "Suas respostas são lidas em voz alta: seja conciso (1 a 4 frases, salvo quando eu",
      "pedir detalhes), escreva frases completas e naturais de se ouvir, sem markdown, listas,",
      "emojis, símbolos ou blocos de código; escreva números e siglas como se fala. Não invente",
      "fatos; diga quando não souber. Você não tem acesso à internet nem à minha agenda.",
      `Data e hora atuais: ${now}.`,
    ].join(" ");
  }

  function addEntry(kind, text) {
    const entry = document.createElement("div");
    entry.className = "entry " + kind;
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = kind === "user" ? "VOCÊ" : kind === "alfred" ? "ALFRED" : "SISTEMA";
    const what = document.createElement("div");
    what.className = "what";
    what.textContent = text;
    entry.append(who, what);
    log.appendChild(entry);
    log.scrollTop = log.scrollHeight;
    return what;
  }

  function render() {
    log.innerHTML = "";
    if (turns.length === 0) addEntry("alfred", GREETING);
    for (const t of turns) addEntry(t.role === "user" ? "user" : "alfred", t.content);
    const box = $("suggestions");
    box.innerHTML = "";
    if (turns.length === 0) {
      for (const s of SUGGESTIONS) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = s;
        b.addEventListener("click", () => ask(s));
        box.appendChild(b);
      }
    }
  }

  // ---------- Painel de voz ----------
  function syncVoiceUi() {
    $("voice").value = voiceSettings.voiceURI;
    $("rate").value = voiceSettings.rate;
    $("pitch").value = voiceSettings.pitch;
    $("rateOut").textContent = Number(voiceSettings.rate).toFixed(2) + "×";
    $("pitchOut").textContent = Number(voiceSettings.pitch).toFixed(2);
  }
  function saveVoice(patch) {
    voiceSettings = { ...voiceSettings, ...patch };
    store.set("voice:v2", voiceSettings);
    syncVoiceUi();
  }
  speaker.onVoices((voices) => {
    const select = $("voice");
    select.innerHTML = "";
    select.add(new Option("Automática (melhor disponível)", ""));
    for (const v of voices) select.add(new Option(`${v.name} (${v.lang})`, v.voiceURI));
    syncVoiceUi();
  });
  if (!speaker.available) {
    $("speak").closest("label").hidden = true;
    $("voicePanel").hidden = true;
    $("chipVoice").textContent = "Indisponível";
  }
  $("voice").addEventListener("change", (e) => saveVoice({ voiceURI: e.target.value }));
  $("rate").addEventListener("input", (e) => saveVoice({ rate: Number(e.target.value) }));
  $("pitch").addEventListener("input", (e) => saveVoice({ pitch: Number(e.target.value) }));
  $("testVoice").addEventListener("click", () => {
    speaker.unlock();
    speaker.cancel();
    $("caption").textContent = VOICE_TEST_LINE;
    speaker.sayAll(VOICE_TEST_LINE);
  });
  $("resetVoice").addEventListener("click", () => {
    saveVoice({ ...VOICE_DEFAULTS, engine: "browser" });
    speaker.cancel();
    speaker.sayAll(VOICE_TEST_LINE);
  });
  syncVoiceUi();

  // ---------- Conversa ----------
  const ERRORS = {
    not_granted: "Você não permitiu que esta página use o Claude. Recarregue para permitir.",
    sampling_disabled: "O Claude não está disponível nesta conta.",
    rate_limited: "Muitas perguntas seguidas. Espere um pouco e tente de novo.",
    session_expired: "Sua sessão expirou. Entre no claude.ai de novo.",
    refused: "Alfred preferiu não responder a isso. Tente perguntar de outro jeito.",
    empty_completion: "Alfred ficou sem palavras. Tente reformular.",
    prompt_too_large: "A conversa ficou longa demais. Toque em Nova conversa.",
  };
  const PERMANENT = new Set([
    "not_granted",
    "sampling_disabled",
    "not_declared",
    "capability_disabled",
    "capability_removed",
  ]);

  function markUnavailable(message) {
    unavailable = true;
    $("send").disabled = true;
    $("online").textContent = "offline";
    setStatus(message, true);
  }

  async function ask(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    speaker.unlock();
    if (!sample) {
      setStatus(unavailable ? "O Claude não está disponível aqui." : "Ainda conectando ao Claude… tente em um instante.", true);
      return;
    }
    speaker.cancel();
    setStatus("");
    turns.push({ role: "user", content: text });
    render();
    const entry = addEntry("alfred", "…");
    $("caption").textContent = "…";
    busy = true;
    $("send").disabled = true;
    settle();
    ctl = new AbortController();
    const chunker = speaker.chunker();
    const say = (pieces) => {
      if ($("speak").checked) for (const p of pieces) speaker.say(p);
    };
    try {
      const recent = turns.slice(-MAX_TURNS);
      const { text: answer } = await sample([{ role: "user", content: rules() }, ...recent], {
        cache: false,
        modelTier: "quick",
        signal: ctl.signal,
        onText: ({ text: full, delta }) => {
          entry.textContent = full;
          $("caption").textContent = full;
          log.scrollTop = log.scrollHeight;
          say(chunker.push(delta));
        },
      });
      say(chunker.flush());
      turns.push({ role: "assistant", content: answer });
      store.set("turns", turns.slice(-MAX_TURNS));
    } catch (e) {
      const code = e && e.code;
      if (e && e.text && code !== "refused") {
        turns.push({ role: "assistant", content: e.text });
        store.set("turns", turns.slice(-MAX_TURNS));
      } else {
        turns.pop();
        entry.closest(".entry").remove();
        if (code === "refused") speaker.cancel();
      }
      if (code !== "cancelled") {
        const message = ERRORS[code] || "A resposta foi interrompida. Tente de novo.";
        addEntry("note", message);
        $("caption").textContent = message;
      }
      if (PERMANENT.has(code)) markUnavailable(ERRORS[code] || "O Claude não está disponível aqui.");
    } finally {
      busy = false;
      $("send").disabled = unavailable;
      settle();
    }
  }

  $("stop").addEventListener("click", () => {
    speaker.cancel();
    ctl && ctl.abort();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") speaker.cancel();
  });
  document.addEventListener("pointerdown", () => speaker.unlock(), { once: true });
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = $("text").value;
    $("text").value = "";
    ask(text);
  });
  $("reset").addEventListener("click", () => {
    speaker.cancel();
    ctl && ctl.abort();
    turns = [];
    store.set("turns", turns);
    $("caption").textContent = GREETING;
    render();
  });
  $("speak").addEventListener("change", (e) => {
    store.set("speak", e.target.checked);
    if (!e.target.checked) speaker.cancel();
  });

  // ---------- Modo ditado ----------
  // O app do Claude não libera o microfone para a página, mas o ditado do teclado (🎤) escreve no
  // campo. Com o modo ditado ligado, a frase é enviada sozinha quando o texto para de mudar.
  const DICTATION_PAUSE_MS = 1700;
  let dictationTimer = null;
  const touch = window.matchMedia?.("(pointer: coarse)").matches ?? false;
  $("autosend").checked = store.get("autosend", touch);
  $("autosend").addEventListener("change", (e) => {
    store.set("autosend", e.target.checked);
    clearTimeout(dictationTimer);
  });
  $("text").addEventListener("input", () => {
    clearTimeout(dictationTimer);
    if (!$("autosend").checked || !$("text").value.trim() || busy) return;
    speaker.cancel(); // falar por cima interrompe o Alfred
    dictationTimer = setTimeout(() => {
      const text = $("text").value;
      if (!text.trim() || busy) return;
      $("text").value = "";
      ask(text);
    }, DICTATION_PAUSE_MS);
  });
  $("form").addEventListener("submit", () => clearTimeout(dictationTimer));

  // ---------- Microfone (o app do Claude costuma bloquear; o ditado do teclado sempre funciona) ----------
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (Recognition) {
    let rec = null;
    $("mic").hidden = false;
    const blocked = () => {
      $("mic").hidden = true;
      micOn = false;
      settle();
      setStatus("O app do Claude não libera o microfone aqui. Use o 🎤 do teclado, ou o Alfred do seu PC.", true);
    };
    $("mic").addEventListener("click", () => {
      if (rec) return rec.stop();
      speaker.cancel();
      try {
        rec = new Recognition();
      } catch {
        return blocked();
      }
      rec.lang = "pt-BR";
      rec.interimResults = true;
      let finalText = "";
      rec.onresult = (e) => {
        let interim = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
          else interim += e.results[i][0].transcript;
        }
        $("text").value = finalText + interim;
        $("caption").textContent = finalText + interim || "…";
      };
      rec.onerror = (e) => {
        if (["not-allowed", "service-not-allowed", "audio-capture"].includes(e.error)) blocked();
      };
      rec.onend = () => {
        rec = null;
        micOn = false;
        $("mic").classList.remove("on");
        settle();
        const text = $("text").value;
        $("text").value = "";
        if (text.trim()) {
          earcons.done();
          ask(text);
        }
      };
      try {
        rec.start();
        earcons.listen();
        micOn = true;
        $("mic").classList.add("on");
        settle();
      } catch {
        rec = null;
        blocked();
      }
    });
  }

  render();
  settle();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("sample").then((fn) => {
      sample = fn;
      if (fn) $("online").textContent = "online";
      else markUnavailable("Abra esta página dentro do Claude para conversar com o Alfred.");
    });
  } else {
    markUnavailable("Abra esta página dentro do Claude para conversar com o Alfred.");
  }
</script>
